name: Release to PyPI

# Publishes on a GitHub Release via PyPI Trusted Publishing (OIDC) — no API
# token stored in the repo. One-time setup required on pypi.org: add this repo
# and workflow as a trusted publisher for the 'agentrouter-os' project
# (see RELEASE.md). Also emits a CycloneDX SBOM and SLSA build provenance.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the SBOM as a release asset
      id-token: write         # OIDC for build-provenance attestation
      attestations: write     # write the provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce all offline release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,mcp]"
          python -m agentrouter eval run --all --no-artifacts --require-release-ready
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install .
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Attest build provenance (SLSA) for the artifacts + SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*
            sbom.cdx.json
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" sbom.cdx.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
