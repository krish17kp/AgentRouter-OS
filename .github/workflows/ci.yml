name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_release_gate:
        description: "Enforce the full release gate (final release validation)"
        type: boolean
        default: false

# No job in this workflow writes to the repository, posts a comment or reads a
# secret — only checkout and artifact upload use the token. Pin it read-only so
# a compromised action in the dependency chain cannot push or open a PR.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests + branch coverage gate (80%)
        run: pytest --cov=agentrouter --cov-branch

      - name: Full evaluation including frozen context holdout (offline, informational)
        # Runs the complete offline evaluation and checks structural invariants.
        # It intentionally does NOT enforce release-readiness — the context-band
        # release gate lives in its own `release-gate` job so a single honest gate
        # failure never reddens the whole test matrix. See KNOWN_LIMITATIONS.md.
        shell: bash
        run: |
          EVAL_RESULT="$RUNNER_TEMP/evaluation-result.json"
          python -m agentrouter eval run --all --json --no-artifacts > "$EVAL_RESULT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "evaluation-result.json").read_text(encoding="utf-8")
          )
          held_out = result["context_band_generalization"]["current_holdout"]["accuracy"]
          gate = result["release_gates"]["context_band_accuracy>=0.90"]
          assert gate is (held_out >= 0.90), (held_out, gate)
          assert len(result["release_gates"]) == 7, result["release_gates"]
          print(f"Held-out context accuracy: {held_out}; release-ready: {result['release_ready']}")
          PY

      - name: Upload evaluation record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/evaluation-result.json

      - name: CLI entrypoints smoke check
        run: |
          python -m agentrouter --help
          agentrouter --help

  # Windows parity: the project targets Windows first (dev machine), so prove
  # the suite and CLI work there too.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Tests + branch coverage gate (80%)
        run: pytest --cov=agentrouter --cov-branch
      - name: CLI smoke check
        run: |
          python -m agentrouter --version
          python -m agentrouter eval context-band-generalization --json

  build-smoke:
    # Post-build verification: the artifact users actually pip-install works.
    # Catches packaging bugs (missing seeds, broken entrypoints) that editable
    # installs never hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          export AGENTROUTER_HOME=/tmp/arhome
          /tmp/wheelenv/bin/agentrouter --version
          /tmp/wheelenv/bin/agentrouter init
          /tmp/wheelenv/bin/agentrouter route "write a short haiku" --json > /tmp/route.json
          python -c "import json; d=json.load(open('/tmp/route.json')); assert d['recommendation'], d"
          /tmp/wheelenv/bin/agentrouter stats
          /tmp/wheelenv/bin/agentrouter registry list

  api-compatibility:
    # The HTTP API is a product contract. This job regenerates it from the real
    # app and fails on any UNDOCUMENTED breaking change, so an incompatible API
    # edit cannot reach the RC without an owner-reviewed decision recorded in the
    # contract manifest. Apart from installing dependencies, nothing here reaches
    # the network: the API under test is an in-process ASGI app, so there is no
    # deployed environment, no credential and no paid inference call.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"
      - name: Check the live API against the committed contract
        run: |
          mkdir -p artifacts/contract
          python -m agentrouter contract check --out artifacts/contract/compatibility.json
      - name: Python SDK + contract tests
        run: python -m pytest -q tests/test_contract.py tests/test_sdk_parity.py tests/test_sdk.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript SDK contract tests
        working-directory: sdk/typescript
        # AGENTROUTER_REQUIRE_LIVE=1 makes the live-app suite fail rather than
        # skip if the Python server cannot start — a skipped parity check must
        # never read as a pass.
        env:
          AGENTROUTER_REQUIRE_LIVE: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Upload compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-compatibility-report
          path: artifacts/contract/
          if-no-files-found: warn
          retention-days: 14

  release-readiness-report:
    # NON-ENFORCING product-readiness report. Runs on every push/PR/dispatch and
    # SUCCEEDS whenever the software executes correctly — even when Release-ready is
    # NO — so an honest sub-0.90 context-band score never reddens ordinary branch CI.
    # It runs the complete evaluation, prints Release-ready YES/NO + every failed
    # gate, uploads the artifact, and never hides or rewrites the real score. The
    # actual gate enforcement lives in `enforce-release-gate` (promotion only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Evaluate and report release readiness (non-enforcing)
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/release-readiness.json"
          python -m agentrouter eval run --all --json --no-artifacts > "$REPORT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "release-readiness.json").read_text(encoding="utf-8")
          )
          ready = report["release_ready"]
          held_out = report["context_band_generalization"]["current_holdout"]["accuracy"]
          gates = report["release_gates"]
          status = "YES" if ready else "NO"
          print(f"::notice title=Release readiness::Release-ready: {status} "
                f"(context_band held-out={held_out})")
          print(f"Release-ready: {status}  (context_band held-out accuracy = {held_out})")
          failed = [name for name, ok in gates.items() if not ok]
          if failed:
              print("Failed release gates:")
              for name in failed:
                  print(f"  - {name}")
          # Non-enforcing: fail ONLY if the evaluation itself is malformed/missing,
          # never because the product is not release-ready.
          assert isinstance(gates, dict) and len(gates) == 7, gates
          PY
      - name: Upload release-readiness record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: ${{ runner.temp }}/release-readiness.json

  enforce-release-gate:
    # THE enforced release gate. Runs ONLY on a production-release event:
    #   * a pull request whose base branch is `main` (RC -> main promotion);
    #   * a release tag push (refs/tags/*);
    #   * an explicit workflow_dispatch with enforce_release_gate=true.
    # It enforces context_band_accuracy >= 0.90 AND every other release gate,
    # fails when any gate fails, never uses continue-on-error, never lowers a
    # threshold, and treats a missing/failed evaluation as failure.
    #
    # Depends on api-compatibility: promoting an RC that breaks the published
    # HTTP contract is a release failure, not a separate concern.
    needs: [api-compatibility]
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.enforce_release_gate == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Enforce ALL release gates (context-band held-out >= 0.90)
        run: |
          python -m agentrouter eval run --all --json --no-artifacts \
            --require-release-ready > "$RUNNER_TEMP/release-gate.json"
      - name: Upload enforced release-gate record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: enforce-release-gate-evaluation
          path: ${{ runner.temp }}/release-gate.json

  # Optional live provider smoke test — hits the real OpenRouter catalog.
  # Runs ONLY on manual dispatch, never on push/PR, and never blocks normal CI.
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Live OpenRouter catalog refresh (keyless, public endpoint)
        run: |
          export AGENTROUTER_HOME=/tmp/live
          agentrouter init
          agentrouter providers refresh openrouter --limit 5 --dry-run
