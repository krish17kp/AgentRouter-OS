# Rust is a separate migration gate. Python remains the release authority until
# Rust reaches full parity; a passing Rust job never overrides the product gates.
name: Rust migration CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy warnings are errors
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  python-rust-parity:
    name: Python/Rust compatibility (non-skipping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference + tests
        run: python -m pip install -e ".[dev]"
      - name: Assert compatibility against the real Rust binary
        run: |
          cargo build --workspace --locked
          python -m pytest -q tests/test_rust_compat.py -rs
