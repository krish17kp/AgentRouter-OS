[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrouter-os"
version = "0.4.0"
description = "CLI-first AI task-routing planner: classifies a task and recommends the best model/tool, with explainable, logged decisions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krish Parekh" }]
requires-python = ">=3.10"
keywords = ["ai", "routing", "cli", "llm", "model-selection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typer>=0.12", "pydantic>=2.5", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "build>=1.0"]
# Heavy evaluation deps — never required by the core runtime or CI-path tests.
# datasets pinned <4: v4+ dropped script-based loaders that CLINC/BANKING77/MASSIVE still use.
eval = ["datasets>=2.14,<4.0"]
property = ["hypothesis>=6.90"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
benchmark = ["pytest-benchmark>=4.0"]
mutation = ["mutmut==3.6.0"]
# Local REST API surface (Phase P7). FastAPI's test client + SDK use httpx.
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Optional OpenTelemetry tracing (backlog L1). Absent -> route_span is a no-op.
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
# MCP server (backlog L2). Reuses the server extra's service layer.
mcp = ["mcp>=1.2"]
# Supply-chain: CycloneDX SBOM generation (backlog L7). Used at release time / in CI.
sbom = ["cyclonedx-bom>=4.0"]
all-eval = [
    "datasets>=2.14",
    "hypothesis>=6.90", "bandit>=1.7", "pip-audit>=2.7",
    "pytest-benchmark>=4.0", "mutmut==3.6.0",
]

[project.urls]
Homepage = "https://github.com/krish17kp/AgentRouter-OS"
Issues = "https://github.com/krish17kp/AgentRouter-OS/issues"

[project.scripts]
agentrouter = "agentrouter.cli:app"

[tool.setuptools.packages.find]
include = ["agentrouter*"]

[tool.setuptools.package-data]
agentrouter = ["seeds/*.yaml", "integrations/**/*", "benchmarks/*.yaml", "benchmarks/*.json", "benchmarks/context_band/*.yaml", "evaluation/fixtures/*.jsonl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # Typer's Option/Argument defaults are calls by design
    "UP042",  # keep (str, Enum): StrEnum changes str(member) semantics for no functional gain
]

[tool.bandit]
# B404 is an informational "you imported subprocess" note; the actual call sites
# are argv-based (shell=False) and carry justified `# nosec B603` markers.
skips = ["B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated unit test",
    "integration: cross-component test",
    "cli: exercises the Typer CLI",
    "evaluation: evaluation framework test",
    "dataset: dataset adapter test",
    "security: security / injection test",
    "property: Hypothesis property test",
    "benchmark: pytest-benchmark performance test",
    "slow: long-running test",
    "network: requires network (never in default CI)",
    "docker: requires Docker (never in default CI)",
    "live: hits a live provider (manual only)",
]

[tool.mutmut]
source_paths = ["agentrouter"]
only_mutate = [
    "agentrouter/safety.py",
    "agentrouter/controls.py",
    "agentrouter/engine.py",
    "agentrouter/hosts.py",
    "agentrouter/server/limits.py",
    "agentrouter/cli.py",
    # TASK-019: only the safety DECISIONS in this module are selected in
    # scripts/run_mutation_ci.py — mutating all 818 statements would roughly
    # double the campaign and push CI past its timeout, which gets a gate
    # disabled rather than obeyed.
    "agentrouter/plugins.py",
]
pytest_add_cli_args = ["--disable-warnings"]
pytest_add_cli_args_test_selection = [
    "tests/test_mvp.py",
    "tests/test_route_controls.py",
    "tests/test_routing_benchmark.py",
    "tests/test_fuzz_and_fallback.py",
    "tests/test_execute.py",
    "tests/test_execute_injection.py",
    "tests/test_model_catalog.py",
    "tests/test_server_limits.py",
    "tests/test_property.py",
    "tests/test_taxonomy.py",
    "tests/test_setup.py",
    "tests/test_mutation_kills.py",
    # TASK-019: the suites that exercise the plugin safety decisions selected in
    # scripts/run_mutation_ci.py. Without these listed, mutmut runs no tests
    # against those mutants and records every one as `no_tests` — which the
    # completeness gate correctly fails rather than scoring as a pass.
    "tests/test_plugins.py",
    "tests/test_plugins_adversarial.py",
    "tests/test_plugins_faults.py",
    "tests/test_plugins_doctor.py",
    "tests/test_plugins_decisions.py",
]
timeout_multiplier = 8.0
timeout_constant = 2.0

[tool.coverage.run]
source = ["agentrouter"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
