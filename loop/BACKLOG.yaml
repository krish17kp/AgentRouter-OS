# ---- Unblocked local work (candidates for this loop) ----
local_open:
  - id: TASK-015
    title: Trusted catalogs — provenance block, deprecation reconciliation, atomic refresh, rollback hardening, provider doctor/status
    priority: 9
    surfaces: [catalog_ops, refresh, registry, cli]
    risk: medium
    reason: >
      Extends TASK-013's deferred scope. Generated catalogs need a structured
      provenance block (source_url, fetched_at, count, tool_version), deprecation
      reconciliation reported on refresh, an atomic (write-temp-then-rename) refresh
      so a crash mid-write cannot corrupt a generated catalog, rollback hardening,
      and provider doctor/status surfaced in the CLI. See
      loop/tasks/TASK-015-trusted-catalogs/.
  - id: L4
    title: Classifier context-band tuning + safety-gate hardening to 0.90
    priority: 5
    surfaces: [classifier, taxonomy]
    risk: medium
    note: >
      SUPERSEDED as a rules/tuning task — TASK-009 proved a hand-rules ceiling
      (rules 0.6667 / learned 0.6889 / hybrid 0.6444, none reach 0.90, learned not
      significantly better). The only honest path to 0.90 is TASK-011/012's
      human-labelled dataset + new private holdout; the external two-annotator
      round is the live blocker (TASK_012_OWNER_ACTIONS.md).
  - id: L8
    title: Verified execution-host states, provider diagnostics + 5-min onboarding
    priority: 6
    surfaces: [hosts, cli, docs]
    risk: low
  - id: L9
    title: Observability runbooks + API/SDK compatibility and load testing
    priority: 5
    surfaces: [server, sdk, docs]
    risk: low

