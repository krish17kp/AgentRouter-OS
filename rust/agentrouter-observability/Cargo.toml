[package]
name = "agentrouter-observability"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Secret-safe structured route observability shared by AgentRouter services"

[dependencies]
regex = "=1.13.1"
serde_json = { version = "1.0.128", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
unicode-general-category = "=0.6.0"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
tokio = { version = "=1.54.1", features = ["rt"] }
