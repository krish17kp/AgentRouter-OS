[package]
name = "agentrouter-registry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Validated offline model registry for the staged AgentRouter Rust migration"

[dependencies]
agentrouter-core = { path = "../agentrouter-core" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_yaml = "0.9.34"
thiserror = "1.0.64"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
