[package]
name = "agentrouter-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentrouter-core = { path = "../agentrouter-core" }
agentrouter-limits = { path = "../agentrouter-limits" }
agentrouter-registry = { path = "../agentrouter-registry" }
agentrouter-classifier = { path = "../agentrouter-classifier" }
agentrouter-policy = { path = "../agentrouter-policy" }
agentrouter-routing = { path = "../agentrouter-routing" }
agentrouter-hosts = { path = "../agentrouter-hosts" }
agentrouter-storage = { path = "../agentrouter-storage" }
agentrouter-usage = { path = "../agentrouter-usage" }
agentrouter-learning = { path = "../agentrouter-learning" }
agentrouter-evaluation = { path = "../agentrouter-evaluation" }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_yaml = { package = "noyalib-serde-yaml", version = "=0.0.60" }
ureq = { version = "=2.10.1", default-features = false, features = ["tls"] }
regex = "=1.13.1"
unicode-general-category = "=0.6.0"
cap-std = "=3.4.4"
fs_at = "=0.2.1"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "=3.13.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "cli_route_cli"
path = "src/bin/route_cli.rs"

[[bin]]
name = "decision_cli"
path = "src/bin/decision_cli.rs"

[[bin]]
name = "init_cli"
path = "src/bin/init_cli.rs"

[[bin]]
name = "registry_cli"
path = "src/bin/registry_cli.rs"

[[bin]]
name = "providers_status_cli"
path = "src/bin/providers_status_cli.rs"

[[bin]]
name = "dashboard_cli"
path = "src/bin/dashboard_cli.rs"

[[bin]]
name = "observability_cli"
path = "src/bin/observability_cli.rs"

[[bin]]
name = "harness_cli"
path = "src/bin/harness_cli.rs"

[[bin]]
name = "doctor_cli"
path = "src/bin/doctor_cli.rs"

[[bin]]
name = "limits_from_json"
path = "src/bin/limits_from_json.rs"

[[bin]]
name = "catalog_ops_from_json"
path = "src/bin/catalog_ops_from_json.rs"

[[bin]]
name = "refresh_from_json"
path = "src/bin/refresh_from_json.rs"

[[bin]]
name = "agentrouter"
path = "src/bin/agentrouter.rs"
