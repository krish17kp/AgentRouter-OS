[package]
name = "agentrouter-evaluation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentrouter-routing = { path = "../agentrouter-routing" }
agentrouter-core = { path = "../agentrouter-core" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "=0.10.9"
unicode-general-category = "=0.6.0"

[[bin]]
name = "evaluation_metrics_from_json"
path = "src/bin/evaluation_metrics_from_json.rs"

[[bin]]
name = "evaluation_quality_from_json"
path = "src/bin/evaluation_quality_from_json.rs"

[[bin]]
name = "evaluation_sample_from_json"
path = "src/bin/evaluation_sample_from_json.rs"

[[bin]]
name = "evaluation_schema_from_json"
path = "src/bin/evaluation_schema_from_json.rs"
