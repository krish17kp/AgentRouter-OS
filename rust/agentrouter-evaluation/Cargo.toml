[package]
name = "agentrouter-evaluation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentrouter-routing = { path = "../agentrouter-routing" }
agentrouter-core = { path = "../agentrouter-core" }
agentrouter-classifier = { path = "../agentrouter-classifier" }
agentrouter-registry = { path = "../agentrouter-registry" }
agentrouter-storage = { path = "../agentrouter-storage" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["preserve_order"] }
sha2 = "=0.10.9"
unicode-general-category = "=0.6.0"

[[bin]]
name = "evaluation_metrics_from_json"
path = "src/bin/evaluation_metrics_from_json.rs"

[[bin]]
name = "evaluation_quality_from_json"
path = "src/bin/evaluation_quality_from_json.rs"

[[bin]]
name = "evaluation_sample_from_json"
path = "src/bin/evaluation_sample_from_json.rs"

[[bin]]
name = "evaluation_schema_from_json"
path = "src/bin/evaluation_schema_from_json.rs"

[[bin]]
name = "evaluation_registry_from_json"
path = "src/bin/evaluation_registry_from_json.rs"

[[bin]]
name = "evaluation_report_from_json"
path = "src/bin/evaluation_report_from_json.rs"

[[bin]]
name = "evaluation_grade_from_json"
path = "src/bin/evaluation_grade_from_json.rs"

[[bin]]
name = "evaluation_safety_from_json"
path = "src/bin/evaluation_safety_from_json.rs"

[[bin]]
name = "evaluation_provider_from_json"
path = "src/bin/evaluation_provider_from_json.rs"

[[bin]]
name = "evaluation_feedback_from_json"
path = "src/bin/evaluation_feedback_from_json.rs"
